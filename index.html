<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Companion</title>
<style>
  :root{--ink:#1b2436; --paper:#fbfaf7; --marker:#ffd400; --ink-soft:#3a4660;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
       background:var(--ink); color:var(--paper); display:flex; align-items:center;
       justify-content:center; padding:24px; line-height:1.75;}
  .wrap{max-width:440px; width:100%; text-align:center;}
  .logo{font-size:16px; font-weight:700; margin-bottom:26px;}
  .logo b{background:var(--marker); color:var(--ink); padding:1px 6px; border-radius:3px;}
  h1{font-size:26px; line-height:1.4; margin-bottom:10px;}
  h1 mark{background:var(--marker); color:var(--ink); padding:1px 7px; border-radius:3px;}
  p.lead{font-size:13.5px; opacity:.75; margin-bottom:22px;}
  #status{font-size:12.5px; opacity:.6; margin-bottom:18px; min-height:34px;}
  a.pick{display:block; background:var(--paper); color:var(--ink); text-decoration:none;
         border-radius:12px; padding:15px 18px; margin-bottom:11px; text-align:left;
         border:2px solid transparent;}
  a.pick:hover{border-color:var(--marker);}
  a.pick b{display:block; font-size:16px; margin-bottom:3px;}
  a.pick span.d{display:block; font-size:12.5px; color:var(--ink-soft); line-height:1.65;}
  a.pick.rec{border-color:var(--marker);}
  a.pick .tag{float:right; background:var(--marker); color:var(--ink); font-size:11px;
       font-weight:700; padding:2px 9px; border-radius:11px; display:none;}
  .foot{margin-top:20px; font-size:12px; opacity:.55; line-height:1.9;}
  .foot a{color:var(--marker); text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Reading <b>Companion</b></div>
  <h1>영어 논문,<br><mark>AI와 같이 읽기</mark></h1>
  <p class="lead">기기에 맞는 화면으로 이동합니다.</p>
  <div id="status">기기를 확인하는 중…</div>

  <a class="pick" id="pcLink" href="pc.html">
    <b>PC 버전<span class="tag" id="pcTag">추천</span></b>
    <span class="d">화면을 둘로 나눠 왼쪽에 대화, 오른쪽에 논문을 함께 봅니다. 확대·축소와 단축키를 지원합니다.</span>
  </a>

  <a class="pick" id="mbLink" href="mobile.html">
    <b>모바일 버전<span class="tag" id="mbTag">추천</span></b>
    <span class="d">세로 화면에 맞춘 구성입니다. 논문을 보다가 아래 대화창을 끌어올려 질문합니다.</span>
  </a>

  <div class="foot">
    처음 쓰시나요? <a href="guide.html">사용 가이드 보기</a><br>
    시험해 볼 PDF가 필요하면 <a href="sample-The-Black-Cat-1896.pdf" download>샘플 소설 내려받기</a><br>
    PDF는 업로드되지 않고 기기 안에서만 처리됩니다.
  </div>
</div>

<script>
"use strict";
(function () {
  var isTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
  var narrow = window.innerWidth < 900;
  var mobileUA = /Android|iPhone|iPad|iPod|Mobile|Silk|Kindle/i.test(navigator.userAgent);
  var useMobile = mobileUA || (isTouch && narrow) || narrow;

  document.getElementById(useMobile ? "mbTag" : "pcTag").style.display = "inline-block";
  document.getElementById(useMobile ? "mbLink" : "pcLink").classList.add("rec");

  var target = useMobile ? "mobile.html" : "pc.html";
  var label = useMobile ? "모바일" : "PC";
  var left = 3, cancelled = false;
  var st = document.getElementById("status");

  function tick() {
    if (cancelled) return;
    if (left <= 0) { location.replace(target); return; }
    st.textContent = label + " 버전으로 이동합니다 (" + left + "초)\n다른 버전을 원하면 아래에서 직접 고르세요";
    st.style.whiteSpace = "pre-line";
    left--;
    setTimeout(tick, 1000);
  }
  tick();

  document.addEventListener("click", function () { cancelled = true; st.textContent = ""; }, true);
  document.addEventListener("keydown", function () { cancelled = true; st.textContent = "자동 이동을 취소했습니다. 원하는 버전을 골라 주세요."; }, true);
})();
</script>
</body>
</html>
